<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>5A2 - Bá Khí Nhất Trường</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle, #35105c, #08000d 70%);
      color: white;
    }

    /* Màn hình mở đầu */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 99;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #050008;

      animation: hideIntro 1s ease 3s forwards;
    }

    #intro h1 {
      text-align: center;
      font-size: clamp(40px, 9vw, 100px);
      text-transform: uppercase;
      letter-spacing: 5px;

      text-shadow:
        0 0 10px white,
        0 0 30px #b000ff,
        0 0 60px #ff00cc;

      animation: zoom 1.5s ease;
    }

    @keyframes zoom {
      from {
        opacity: 0;
        transform: scale(0.3);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes hideIntro {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    /* Profile */
    .profile {
      width: min(850px, 90%);
      padding: 50px 25px;

      text-align: center;

      border-radius: 30px;
      border: 1px solid rgba(255,255,255,.2);

      background: rgba(255,255,255,.08);
      backdrop-filter: blur(15px);

      box-shadow:
        0 0 40px rgba(170,0,255,.4),
        inset 0 0 30px rgba(255,255,255,.03);
    }

    .avatar {
      width: 120px;
      height: 120px;

      margin: auto;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;

      font-size: 45px;
      font-weight: bold;

      background: linear-gradient(135deg, #7700ff, #ff0088);

      box-shadow:
        0 0 20px #9d00ff,
        0 0 50px #ff0099;
    }

    h2 {
      margin-top: 25px;

      font-size: clamp(45px, 8vw, 80px);

      text-shadow:
        0 0 15px #ff00cc,
        0 0 35px #8700ff;
    }

    .slogan {
      margin-top: 10px;

      font-size: 22px;
      font-weight: bold;

      color: #ff9cec;
    }

    .description {
      margin: 20px auto;
      max-width: 600px;

      color: #ddd;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 30px;
    }

    button {
      padding: 14px 25px;

      border: none;
      border-radius: 15px;

      color: white;
      font-weight: bold;
      font-size: 16px;

      cursor: pointer;

      background: linear-gradient(135deg, #7200ff, #ff0088);

      box-shadow: 0 0 20px rgba(255,0,180,.3);

      transition: .25s;
    }

    button:hover {
      transform: translateY(-5px) scale(1.04);
      box-shadow: 0 0 30px #ff00cc;
    }

    /* Hạt sáng */
    .particle {
      position: fixed;

      width: 4px;
      height: 4px;

      border-radius: 50%;
      background: white;

      box-shadow: 0 0 10px white;

      animation: fly linear infinite;
    }

    @keyframes fly {
      from {
        transform: translateY(110vh);
      }

      to {
        transform: translateY(-10vh);
      }
    }
  </style>
</head>

<body>

  <!-- Màn hình xuất hiện đầu tiên -->
  <div id="intro">
    <h1>5A2 BÁ KHÍ NHẤT TRƯỜNG 🔥</h1>
  </div>

  <!-- PROFILE -->
  <div class="profile">

    <div class="avatar">
      5A2
    </div>

    <h2>5A2</h2>

    <div class="slogan">
      BÁ KHÍ NHẤT TRƯỜNG 🔥
    </div>

    <p class="description">
      Chào mừng đến với profile của 5A2.
      Nơi hội tụ những thành viên bá khí,
      vui vẻ và không ngán ai 😎
    </p>

    <div class="buttons">

      <button onclick="alert('5A2 MÃI ĐỈNH 🔥🔥🔥')">
        5A2 MÃI ĐỈNH
      </button>

      <button onclick="document.documentElement.requestFullscreen()">
        FULLSCREEN
      </button>

    </div>

  </div>

  <script>

    /* Tạo hiệu ứng hạt sáng */
    for (let i = 0; i < 60; i++) {

      const particle = document.createElement("div");

      particle.className = "particle";

      particle.style.left =
        Math.random() * 100 + "vw";

      particle.style.animationDuration =
        (4 + Math.random() * 8) + "s";

      particle.style.animationDelay =
        (-Math.random() * 10) + "s";

      particle.style.opacity =
        0.2 + Math.random() * 0.8;

      document.body.appendChild(particle);
    }

  </script>

</body>
  </html>
